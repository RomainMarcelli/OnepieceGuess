<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Personnages</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="character.css">
</head>

<body>

    <header>
        <img class="logo_img" src="../img/One-Piece-Logo.png" alt="Logo">

        <!-- Barre de Navigation entre les différents modes de Jeu -->
        <nav>
            <div class="progress_nav">
                <div class="background"></div>
                <div class="imagesJeu">
                    <div class="guessPerso">
                        <img src="../img/guessPerso.png" alt="">
                    </div>
                    <div class="devilFruit">
                        <img src="../img/devilFruit.png" alt="">
                    </div>
                    <div class="vs">
                        <img src="../img/vs.png" alt="">
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <h1>Listes de personnages</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher un personnage...">
        </div>

        <div class="filters">
            <label for="genderFilter">Genre :</label>
            <select id="genderFilter">
                <option value="all">Tous</option>
                <option value="Masculin">Masculin</option>
                <option value="Féminin">Féminin</option>
            </select>

            <label for="affiliationFilter">Équipage :</label>
            <select id="affiliationFilter">
                <option value="all">Tous</option>
                <option value="Straw Hat Pirates">Straw Hat Pirates</option>
                <option value="Marine">Marine</option>
                <option value="Armée Révolutionnaire">Armée Révolutionnaire</option>
                <option value="Équipage de Barbe Blanche">Équipage de Barbe Blanche</option>
                <option value="Équipage des Pirates de Roger">Équipage des Pirates de Roger</option>
                <option value="Équipe aux Cent Bêtes">Équipe aux Cent Bêtes</option>
                <option value="Équipage du Roux">Équipage du Roux</option>
                <option value="Équipage de Barbe Noire">Équipage de Barbe Noire</option>
                <option value="Guilde de la Croix">Guilde de la Croix</option>
                <option value="Équipage de Kid">Équipage de Kid</option>
                <option value="Équipage du Heart">Équipage du Heart</option>
                <option value="Équipage de Big Mom">Équipage de Big Mom</option>
                <option value="Donquichote Pirates">Donquichote Pirates</option>
                <option value="Gouvernement Mondial">Gouvernement Mondial</option>
                <option value="CP-AIGIS0">CP-AIGIS0</option>
                <option value="Famille Kozuki">Famille Kozuki</option>
                <option value="Famille Riku">Famille Riku</option>
                <option value="Famille Vinsmoke">Famille Vinsmoke</option>
                <option value="Principauté de Mokomo">Principauté de Mokomo</option>
                <option value="Famille Neptune">Famille Neptune</option>
                <option value="Autre">Autre</option>
            </select>

            <label for="hakiFilter">Haki :</label>
            <select id="hakiFilter">
                <option value="all">Tous</option>
                <option value="3">Rois, Armement, Vision</option>
                <option value="2">Armement & Vision</option>
                <option value="1">Vision ou Armement</option>
                <option value="0">Aucun</option>
            </select>     
            
            <div class="filter-container">
                <label for="arcFilter">Arc :</label>
                <select id="arcFilter">
                    <option value="all">Tous</option>
                    <option value="Romance Dawn">Romance Dawn</option>
                    <option value="Orange Town">Orange Town</option>
                    <option value="Syrup Village">Syrup Village</option>
                    <option value="Baratie">Baratie</option>
                    <option value="Arlong Park">Arlong Park</option>
                    <option value="Loguetown">Loguetown</option>
                    <option value="Reverse Mountain">Reverse Mountain</option>
                    <option value="Whisky Peak">Whisky Peak</option>
                    <option value="Little Garden">Little Garden</option>
                    <option value="Drum Island">Drum Island</option>
                    <option value="Alabasta">Alabasta</option>
                    <option value="Jaya">Jaya</option>
                    <option value="Skypiea">Skypiea</option>
                    <option value="Water 7">Water 7</option>
                    <option value="Enies Lobby">Enies Lobby</option>
                    <option value="Thriller Bark">Thriller Bark</option>
                    <option value="Sabaody Archipelago">Sabaody Archipelago</option>
                    <option value="Amazon Lily">Amazon Lily</option>
                    <option value="Impel Down">Impel Down</option>
                    <option value="Marineford">Marineford</option>
                    <option value="Post-War">Post-War</option>
                    <option value="Fishman Island">Fishman Island</option>
                    <option value="Punk Hazard">Punk Hazard</option>
                    <option value="Dressrosa">Dressrosa</option>
                    <option value="Zou">Zou</option>
                    <option value="Whole Cake Island">Whole Cake Island</option>
                    <option value="Film Red">Film Red</option>
                    <option value="Wano">Wano</option>
                    <option value="Egg Head">Egg Head</option>
                </select>
            </div>    
            
            <div class="filter-container">
                <label for="devilFruitFilter">Fruit du Démon :</label>
                <select id="devilFruitFilter">
                    <option value="all">Tous</option>
                    <option value="hasFruit">Possède un fruit du démon</option>
                    <option value="zoan">Zoan</option>
                    <option value="paramecia">Paramecia</option>
                    <option value="logia">Logia</option>
                    <option value="noFruit">Aucun fruit du démon</option>
                </select>
            </div>                       
            
        </div>

        <div class="bounty-filter">
            <label for="bountyRange">Fourchette de prime :</label>
            <div class="range-container">
                <div class="range-progress" id="rangeProgress"></div>
                <input type="range" id="bountyMin" min="0" max="6000000000" step="100000" value="0">
                <input type="range" id="bountyMax" min="0" max="6000000000" step="100000" value="6000000000">
            </div>
            <div class="bounty-values">
                <span id="bountyMinValue">0 B</span>
                <span id="bountyMaxValue">6 B</span>
            </div>
        </div>                     

        <div id="charactersContainer" class="characters-grid"></div>
        <!-- Modale pour afficher les détails -->
        <div id="characterModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="modal-body">
                    <img id="modalCharacterImage" src="" alt="Personnage">
                    <h2 id="modalCharacterName"></h2>
                    <p><strong>Alias :</strong> <span id="modalCharacterAlias"></span></p>
                    <p><strong>Fruit du démon :</strong> <span id="modalCharacterDevilFruit"></span></p>
                    <p><strong>Haki :</strong> <span id="modalCharacterHaki"></span></p>
                    <p><strong>Affiliation :</strong> <span id="modalCharacterAffiliation"></span></p>
                    <p><strong>Taille :</strong> <span id="modalCharacterHeight"></span></p>
                    <p><strong>Genre :</strong> <span id="modalCharacterGender"></span></p>
                    <p><strong>Prime :</strong> <span id="modalCharacterBounty"></span></p>
                    <p><strong>Premier Arc :</strong> <span id="modalCharacterFirstArc"></span></p>
                </div>
            </div>
        </div>

        <p id="totalCharacters" class="total-characters-count">Nombre de personnages affichés : 0</p>

    </main>

    <script src="character.js"></script>
</body>

</html>
