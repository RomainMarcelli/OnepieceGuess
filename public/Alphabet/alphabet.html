<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/favicon-32x32.png" type="image/png">
  <title>One Piece Guessing Game</title>
  <link rel="stylesheet" href="alphabet.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../responsive.css">
</head>

<body>
  <img class="logo_img" src="../img/One-Piece-Logo.png" alt="Logo">
  <nav>
    <div class="progress_nav">
      <div class="background">
      </div>
      <div class="imagesJeu">
        <div class="guessPerso">
          <img src="../img/guessPerso.png" alt="">
        </div>
        <div class="devilFruit">
          <img src="../img/devilFruit.png" alt="">
        </div>
      </div>
      <a href="../guessPerso.html" style="position: absolute;">Nouveau mode</a>
    </div>
  </nav>
  <main>
    <div class="game-container">
      <h1>One Piece Guessing Game</h1>
      <p>Devinez le personnage de One Piece à partir de la première lettre !</p>
  
      <!-- Menu de sélection des rounds -->
      <div id="round-selection">
        <p>Choisissez le nombre de rounds :</p>
        <button class="round-option" data-rounds="5">5 rounds</button>
        <button class="round-option" data-rounds="10">10 rounds</button>
        <button class="round-option" data-rounds="15">15 rounds</button>
        <button class="round-option" data-rounds="20">20 rounds</button>
        <button class="round-option" data-rounds="25">25 rounds</button>
      </div>
  
      <!-- Jeu -->
      <div id="game" style="display: none;">
        <div class="game-board">
          <div id="letter-display"></div>
          <input type="text" id="player-input" placeholder="Entrez un nom" />
          <button id="submit-button">Soumettre</button>
        </div>
        <div id="feedback"></div>
        <div id="score">Score : 0</div>
        <div id="round-info"></div>
      </div>
      <div id="round-info"></div>
      <div id="time-taken" style="margin-top: 10px; font-size: 1.2em; color: #666;"></div>
    </div>
  </main>
  <script src="alphabet.js"></script>
  <!-- <script src="../script.js"></script> -->
</body>

</html>
